# ============================================================
#  openclash-ai-guard 配置文件
#  改完执行:  /etc/openclash/ai-guard/reload.sh
# ============================================================
#  这个文件被 shell 和 ruby 两边读取，所以只写 KEY="值" 这一种格式，
#  不要用变量引用、反引号、多行值。

# ---------- 出口策略组的名字 ----------
# 脚本会自己新建这两个组，名字随你改，但改了之后旧组会残留在面板里（重启一次即清）
AI_API_GROUP="AI-API"
AI_CHAT_GROUP="AI-Chat"

# ---------- 探测目标（最关键的一项，别乱改）----------
# 必须和你实际要访问的东西走同一条路。用 gstatic 测出来的"最快节点"对 AI 服务
# 经常是完全不通的 —— 这是实测结论，不是猜测。
#
# AI_API_PROBE: Claude / Anthropic / 各类中转站多在 Cloudflare 后面，
#               cp.cloudflare.com 是 Cloudflare 官方连通性检测端点，走同一张 anycast 网。
# AI_CHAT_PROBE: ChatGPT 自己的 Cloudflare trace 端点。
AI_API_PROBE="https://cp.cloudflare.com/generate_204"
AI_CHAT_PROBE="https://chatgpt.com/cdn-cgi/trace"

# ---------- 探测间隔（秒）----------
# 越短越快发现节点坏掉，但请求量也越大。候选池 50 个节点、间隔 120 秒
# ≈ 每分钟 25 次请求。打 ChatGPT 的那个建议放宽一档，免得被当成滥用。
AI_API_INTERVAL="120"
AI_CHAT_INTERVAL="240"

# ---------- 容差（毫秒）----------
# url-test 只有在"别的节点比当前节点快超过这个值"时才切换。
# 设小了会来回跳（切换会打断正在传输的长连接），设大了反应慢。
# 500 的含义：大家都在 200ms 上下时按住不动，某个节点掉到 700ms+ 才换掉它。
TOLERANCE="500"

# ---------- 排除节点（Ruby 正则，留空 = 不排除任何节点）----------
# 只排除那种"结构性"不行的节点 —— 比如某地区线路长期抖动到几秒。
# 千万不要拿它排除"今天测出来是坏的"节点：机场的坏节点集合几小时就换一批，
# 写死名单只会把好节点冤枉关在门外。日常好坏由健康检查自己判断。
# 例:  EXCLUDE_NODE_RE="^TW-"        排除所有以 TW- 开头的
# 例:  EXCLUDE_NODE_RE="台湾|下载专用"  排除名字里含这些字的
#
# 注意：一旦填了值，它会同时作用于订阅自带的所有自动选择 / 负载均衡组，
# 不只是本工具新建的两个组。留空则完全不碰你的原有配置。
EXCLUDE_NODE_RE=""
# ---------- 哪些域名走 AI-API ----------
# 空格分隔。会生成 DOMAIN-SUFFIX 规则，插在规则表最前面，优先级高于任何 RULE-SET。
# 把你自己用的中转站域名加在后面即可。注意填主域名，子域名会自动覆盖
# （写 anthropic.com 就同时管住 api.anthropic.com、console.anthropic.com）。
AI_API_DOMAINS="anthropic.com claude.ai"

# ---------- 哪些域名走 AI-Chat ----------
AI_CHAT_DOMAINS="openai.com chatgpt.com oaistatic.com oaiusercontent.com sora.com"

# ---------- 顺便接管已有的策略组（空格分隔，不存在的自动跳过）----------
# 如果你的订阅自带 OpenAI / Claude 这类分流组，把它们指到新出口上，
# 这样连订阅自带的 RULE-SET 覆盖的域名也一起受益。留空 = 只用上面的域名规则。
AI_CHAT_ADOPT_GROUPS="OpenAI ChatGPT"
AI_API_ADOPT_GROUPS="Claude Anthropic"

# ============================================================
#  看护脚本（ai-node-watch.sh）
# ============================================================

# 延迟超过这个值也算"坏"——能回包但已经残废的节点比干脆的死节点更麻烦
BAD_MS="2000"

# 坏节点比例阈值。默认 2/3：超过三分之二的节点不行才认为是机场整体出问题
BAD_RATIO_NUM="2"
BAD_RATIO_DEN="3"

# 连续多少次超阈值才真的去刷订阅（cron 每 10 分钟一次 → 3 次约等于 30 分钟）
# 别设成 1：晚高峰随便抖一下就去重启，反而更糟
NEED_STREAK="3"

# 两次刷新订阅之间的最小间隔（秒），默认 4 小时
COOLDOWN="14400"

# 自愈：每次运行时检查 OpenClash 官方钩子里的调用是否还在，不在就补回去。
# 需要开着 —— OpenClash 的 opkg 升级会把 custom/ 里的官方文件覆盖回默认版，
# 那会让本工具静默失效（组消失、规则不再注入）。1=开 0=关
SELF_HEAL="1"

# 删掉配置里的 global-client-fingerprint。较新的 mihomo 已移除该字段并在启动时
# 报 error（不影响运行）。只有当你的每个节点自己都带 client-fingerprint 时才开。
# 1=删 0=不动（默认不动，别人的配置未必满足条件）
DROP_GLOBAL_FINGERPRINT="0"
